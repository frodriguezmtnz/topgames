name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # El build necesita estas variables (se validan en runtime del build
          # solo si se leen; aqui solo se evita generar el cliente en el paso de install).
          DATABASE_URL: "postgresql://cicd:cicd@localhost:5432/cicd"
      - name: Typecheck
        run: npx tsc --noEmit